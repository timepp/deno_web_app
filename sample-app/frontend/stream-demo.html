<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Stream Demo</title>
    <style>
        body {
            font-family: 'Consolas', 'Monaco', monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005a9e;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .output-section {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 4px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.running {
            background-color: #fff3cd;
            color: #856404;
        }
        .status.completed {
            background-color: #d4edda;
            color: #155724;
        }
        .status.idle {
            background-color: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Real-time Command Output Demo</h1>
    <div class="container">
        <div class="input-section">
            <input type="text" id="command" placeholder="Command (e.g., 'ping')" value="ping">
            <input type="text" id="args" placeholder="Arguments (comma separated, e.g., '127.0.0.1, -n, 5')" value="127.0.0.1,-n,10">
            <button id="runBtn">Run Command</button>
        </div>
        <div id="status" class="status idle">Ready</div>
        <div class="output-section" id="output"></div>
    </div>

    <script type="module">
        import { api } from '../api.ts'
        import { subscribeToStream, unsubscribeFromStream } from './websocket-client.ts'

        const commandInput = document.getElementById('command')
        const argsInput = document.getElementById('args')
        const runBtn = document.getElementById('runBtn')
        const outputDiv = document.getElementById('output')
        const statusDiv = document.getElementById('status')

        let currentSessionId = null

        runBtn.addEventListener('click', async () => {
            const command = commandInput.value.trim()
            const argsStr = argsInput.value.trim()
            const args = argsStr ? argsStr.split(',').map(s => s.trim()) : []

            if (!command) {
                alert('Please enter a command')
                return
            }

            // Clear previous output
            outputDiv.textContent = ''
            runBtn.disabled = true
            statusDiv.textContent = 'Running...'
            statusDiv.className = 'status running'

            try {
                // Call API to start command execution
                const sessionId = await api.runCommandAndCaptureOutput(command, args)
                currentSessionId = sessionId
                
                outputDiv.textContent += `[Session ${sessionId}]\n`
                outputDiv.textContent += `$ ${command} ${args.join(' ')}\n\n`

                // Subscribe to stream
                subscribeToStream(
                    sessionId,
                    // onData callback
                    (data) => {
                        outputDiv.textContent += data
                        // Auto-scroll to bottom
                        outputDiv.scrollTop = outputDiv.scrollHeight
                    },
                    // onComplete callback
                    () => {
                        outputDiv.textContent += '\n\n[Command completed]'
                        outputDiv.scrollTop = outputDiv.scrollHeight
                        runBtn.disabled = false
                        statusDiv.textContent = 'Completed'
                        statusDiv.className = 'status completed'
                        currentSessionId = null
                    }
                )
            } catch (error) {
                outputDiv.textContent += `\nError: ${error}`
                runBtn.disabled = false
                statusDiv.textContent = 'Error'
                statusDiv.className = 'status idle'
            }
        })

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (currentSessionId) {
                unsubscribeFromStream(currentSessionId)
            }
        })
    </script>
</body>
</html>
